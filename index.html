<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header class="header">
      <h2>🌸 Flower Shop Admin</h2>

        <a href="logout.html">Đăng xuất</a>

    <!-- MAIN -->
    <div class="container">
      <!-- SIDEBAR -->
      <nav class="sidebar">
