<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Thêm khách hàng</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <h2>Quản trị hệ thống</h2>
        <ul>
          <li class="active">
            <a href="users.html">Quản lý khách hàng</a>
          </li>
        </ul>
      </div>

      <div class="content">
        <h3>Thêm khách hàng</h3>

        <form class="form-user">
          <label>Tên khách hàng:</label>
          <input type="text" required />

          <label>Email:</label>
          <input type="email" required />

          <label>Số điện thoại:</label>
          <input type="text" required />

          <label>Địa chỉ:</label>
          <input type="text" required />

          <br /><br />
          <button type="submit">Lưu</button>
          <a href="list.html"><button type="button">Hủy</button></a>
        </form>
      </div>
    </div>
  </body>
</html>
